name: Bug
about: Report a reproducible bug or regression
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, input, environment, and expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include relevant logs. Remove secrets and personal data.
