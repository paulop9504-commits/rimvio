name: Rimvio CI Gate

on:
  push:
    branches: [main, master, release/v1-rimvio-core]
  pull_request:
    branches: [main, master, release/v1-rimvio-core]

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Playbook regression
        run: npm run test:playbook

      - name: Self-learning gate (95%)
        run: npm run self-learning:gate

      - name: Unified stress
        run: npm run test:unified-stress
